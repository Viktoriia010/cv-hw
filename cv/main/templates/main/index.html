{% extends 'main/layout.html' %}
{% block title %}
Main Page
{% endblock %}

{% block content %}
   <!-- Profile -->
    <div class="card hero p-4 mb-4">
        <div class="row align-items-center text-center text-md-start">

            <div class="col-md-4 text-center mb-3 mb-md-0">
                <img
                    src="https://upload.wikimedia.org/wikipedia/commons/7/79/Tesla_circa_1890.jpeg"
                    alt="Nikola Tesla"
                    class="profile-img img-fluid"
                >
            </div>

            <div class="col-md-8">
                <h1 class="fw-bold">Nikola Tesla</h1>
                <h4 class="text-warning">Винахідник та інженер-електрик</h4>

                <p class="mt-3">
                    <strong>Місто:</strong> Нью-Йорк, США
                </p>

                <p>
                    <strong>Роки життя:</strong> 1856–1943
                </p>

                <p>
                    <strong>Email:</strong> Не застосовується
                </p>

                <p>
                    <strong>Телефон:</strong> Не застосовується
                </p>
            </div>

        </div>
    </div>
{% endblock %}
